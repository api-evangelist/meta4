name: Meta4
description: >-
  Meta4 is a human capital management (HCM) software provider founded in Madrid,
  Spain, delivering cloud-based payroll, talent, and time-management applications
  widely used across the Spanish-speaking world and Europe. Backed by Insight
  Partners, Meta4 was acquired by Cegid in 2019 and its PeopleNet HCM platform is
  now delivered as part of the Cegid HR product family. The developer surface —
  Core HR, payroll, and talent APIs — is published through the Cegid HR developer
  portal rather than a standalone Meta4 developer program.
